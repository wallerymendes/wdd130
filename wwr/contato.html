<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Entre em contato conosco. Tire suas dúvidas, solicite informações ou fale com nossa equipe. Estamos prontos para ajudar.">
    <meta name="author" content="wallery trhysha Barbosa mendes">
    <title>Fale Conosco Água brava rafting </title>
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>

    <header>
        <img src="imagens/agua-brava-rafting.png" alt="logotipo agua brava rafting." width="100">

        <nav>

            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>

        </nav>
    </header>
    <main>
        <section class="contato">
            <h1>Companhia de Rafting em Corredeiras</h1>
            <p>
                123 Rua Principal do rio<br>
                Foz do iguaçu, Paraná<br>
                +55 45 99999-9999<br>
                info@correiras.com 
            </p>
        </section>
            <div class="container-mapa-form">
                <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d115219.07928028076!2d-54.629102221759304!3d-25.518509313430922!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94f690ebae530a43%3A0x21979473b4c4a952!2sFoz%20do%20Igua%C3%A7u%2C%20PR!5e0!3m2!1spt-BR!2sbr!4v1791149256695!5m2!1spt-BR!2sbr" 
                width="350" height="350" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>


                <form>
                    <fieldset>  
                        
                        <div class="item-formulario coluna2">
                            <label for="nome"> Nome</label>
                            <input type="text" id="nome" name="nome" placeholder="Digite aqui" required>
                        </div>
                        <div class="item-formulario coluna2">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="Digite aqui" required>
                        </div>

                        <legend>Propósito da Mensagem</legend>
                        <div class="item-formulario coluna1">
                            
                            <div class="container-radio-opcoes">
                                <label for="duvida">Dúvida Geral</label>
                                    <input type="radio" id="duvida" name="proposito-mensagem" value="duvida">
                                    Dúvida Geral
                
                            
                                <label for="pergunta">Pergunta sobre Reserva</label>
                                    <input type="radio" id="pergunta" name="proposito-mensagem" value="pergunta">
                                    
                                
                                <label for="sugestao">Sugestão</label>
                                    <input type="radio" id="sugestao" name="proposito-mensagem" value="sugestao">
                                    
                            
                            </div>
                        </div>

                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" placeholder="Digite aqui"></textarea>
                    
                    

                        <div class="item-formulario coluna1">
                            <input type="checkbox" id="newsletter" name="newsletter">
                            <label for="newsletter">Por favor, me inscreva na newsletter mensal</label>
                        </div>
                    </fieldset>
                    <button type="submit">Entrar em Contato!</button>
            
                </form>
            </div>    

            <section class="equipe-cargo">
                <h2>Estamos aqui para serví-lo</h2>
                <div class="galeria-contatos">
                    <figure>
                        <img src="imagens/allan-willis.jpg" alt="Perfil do allan willis" />
                        <figcaption>Allan Willis - Condutor</figcaption>
                    </figure>
                    <figure>
                        <img src="imagens/gabi-martins.jpg" alt="Perfil da Gabi Martins" />
                        <figcaption>Gabi Martins - Guia de Segurança</figcaption>
                    </figure>
                    <figure>
                        <img src="imagens/kali-harris.jpg" alt="Perfil da Kali Harris" />
                        <figcaption>Kali Harris - Coordenadora de Operações</figcaption>
                    </figure>
                </div>
            </section>
        </section>
    </main>

    <footer>
        <p>©️2026 - Água Brava Rafting - Wallery Mendes </p>

        <nav class="redes-sociais">
            <a href="https://facebook.com" target="_blank">
                <img src="imagens/facebook.svg" alt="ícone do Facebook">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="imagens/linkedin.svg" alt="ícone do LinkedIn">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="imagens/instagram.svg" alt="ícone do Instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
